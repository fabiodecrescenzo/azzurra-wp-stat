<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Azzurra WP Stat</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b3d91">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;height:100dvh;overflow:hidden;background:#fff;color:#102a43;font-family:system-ui,Roboto,sans-serif}
body{display:flex;flex-direction:column;touch-action:manipulation}
#top{display:flex;align-items:center;gap:10px;padding:5px 10px;background:#0b3d91;color:#fff;flex:0 0 auto}
#top .sc{display:flex;align-items:center;gap:8px;font-size:30px;font-weight:800;white-space:nowrap;background:#082c6c;border-radius:8px;padding:0 12px;height:46px}
#top .sc small{font-size:15px;font-weight:600;opacity:.85}
#top input{font-size:17px;font-weight:600;padding:4px 6px;border:0;border-radius:5px;width:120px;background:#082c6c;color:#fff}
#top button{font-size:16px;font-weight:600;height:42px;padding:0 12px;border:0;border-radius:8px;background:#1e63c6;color:#fff;min-width:44px}
#top .og button{background:#7a2e9a}
#top .og button.u{background:#e65100}
#top .per{min-width:50px}
#top .per.on{background:#ffd600;color:#000}
#undo{background:#455a64!important}
#last{flex:1;font-size:15px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.og{display:flex;gap:5px}
#g{flex:1;display:grid;grid-template-columns:44px minmax(110px,1.3fr) repeat(5,1fr) 6px 44px .9fr;grid-template-rows:auto;grid-auto-rows:1fr;min-height:0}
#g>div{border-bottom:1px solid #cfd8e3;border-right:1px solid #e3e8ef;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,3.9vh,30px);overflow:hidden;min-height:0}
#g .h{font-size:clamp(11px,1.9vh,15px);font-weight:800;text-align:center;line-height:1.15;color:#fff;padding:5px 2px;border-right:1px solid rgba(255,255,255,.4)}
#g .hn{background:#0b3d91}.hg{background:#2e7d32}.ha{background:#1565c0}.hu{background:#e65100}.he{background:#c62828}.hx{background:#6a1b9a}
#g .z{background:#f3f6fa}
#g .n{font-weight:800;color:#0b3d91;font-size:clamp(15px,3.2vh,24px)}
#g .nm{justify-content:flex-start;padding:0 6px}
#g .nm input{width:100%;border:0;background:transparent;font-size:clamp(13px,2.7vh,20px);font-weight:600;color:#102a43;user-select:text;-webkit-user-select:text}
#g .c{font-weight:800;cursor:pointer}
#g .cg{color:#1b5e20}#g .ca{color:#0d47a1}#g .ce{color:#b71c1c}#g .cx{color:#6a1b9a}
#g .up{background:#fff4e8;color:#e65100}
#g .z.up{background:#ffead6}
#g .gl{border-left:3px solid #90a4ae}
#g .flash{background:#ffd600!important;transition:none}
#g .rowfl{background:#fff59d!important;transition:none}
#g .c{transition:background .4s}
#g .sep{background:#0b3d91;border:0}
#g .tot{background:#dfe7f1;font-weight:800;font-size:clamp(15px,3.2vh,24px);border-top:2px solid #0b3d91}
#g .out{background:#ffcdd2!important;color:#b71c1c}
#g .dim{opacity:.45}
#g .dim input{text-decoration:line-through}
#g .last{box-shadow:inset 4px 0 0 #ffd600}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}
#ov .box{background:#fff;padding:14px;border-radius:10px;width:min(700px,94vw);max-height:92vh;display:flex;flex-direction:column;gap:10px}
#ov textarea{flex:1;min-height:300px;font-size:16px;font-family:monospace;padding:8px;user-select:text;-webkit-user-select:text}
#ov .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-size:17px;padding:10px 14px;border:0;border-radius:8px;background:#1e63c6;color:#fff}
#msg{position:fixed;left:50%;top:62px;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 16px;border-radius:8px;font-size:17px;display:none}
#top{flex-wrap:wrap;row-gap:5px}
@media (orientation:portrait){
 #top .sc{font-size:26px;height:42px}#top input{width:110px}
 #last{order:9;flex-basis:100%;text-align:left}
 #g{grid-template-columns:36px minmax(96px,1.2fr) repeat(5,1fr) 4px 34px .8fr}
 #g .h{font-size:12px}
 #g>div{font-size:26px}
 #g .n,#g .tot{font-size:19px}
 #g .nm input{font-size:15px}
 #g .nm{padding:0 3px}
}
#st{position:fixed;inset:0;background:rgba(11,61,145,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:9}
#go{font-size:44px;font-weight:800;padding:26px 60px;border:0;border-radius:18px;background:#ffd600;color:#000;display:flex;flex-direction:column;align-items:center}
#go small{font-size:18px;font-weight:600}
#stinfo{color:#fff;font-size:22px;font-weight:700;text-align:center;line-height:1.4}
#stsave{color:#fff;font-size:15px;opacity:.9}
#nofs{font-size:16px;background:none;border:0;color:#fff;text-decoration:underline;padding:10px}
#fs.warn{background:#ffd600!important;color:#000!important}
#home{position:fixed;inset:0;background:#eef2f8;z-index:8;display:flex;flex-direction:column}
#home header{background:#0b3d91;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px}
#home header img{width:46px;height:46px;border-radius:50%;background:#fff}
#home header h1{font-size:24px;flex:1}
#home header small{font-size:14px;opacity:.85}
#list{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.12);display:flex;align-items:center;gap:14px;padding:14px 16px;border-left:8px solid #90a4ae;cursor:pointer}
.card.run{border-left-color:#ffd600}.card.done{border-left-color:#2e7d32}
.card .when{width:170px;font-size:15px;color:#455a64;line-height:1.35}
.card .when b{display:block;font-size:17px;color:#0b3d91}
.card .match{flex:1;font-size:22px;font-weight:800;color:#102a43}
.card .match small{display:block;font-size:14px;font-weight:500;color:#607d8b;margin-top:3px}
.card .st{font-size:15px;font-weight:700;padding:8px 12px;border-radius:8px;background:#eceff1;color:#455a64;text-align:center;min-width:130px}
.card.run .st{background:#fff3c4;color:#6d4c00}.card.done .st{background:#e3f4e4;color:#1b5e20}
.card .st b{display:block;font-size:22px}
.card .del{border:0;background:none;font-size:22px;padding:8px;opacity:.5}
#home footer{padding:10px 18px 16px;display:flex;gap:10px;flex-wrap:wrap}
#home footer .btn{font-size:18px;padding:12px 18px}
#empty{text-align:center;color:#607d8b;font-size:18px;padding:40px 10px;line-height:1.5}
body.ro #g .c{pointer-events:none}
body.ro .og,body.ro .per,body.ro #undo{display:none}
body.ro #g .nm input,body.ro #opp{pointer-events:none}
#rob{display:none;background:#2e7d32!important}
body.ro #rob{display:inline-block}
#home2{background:#455a64!important;font-size:22px!important}
#top{gap:6px!important}#top button{padding:0 10px!important}#last{flex:1 1 0;min-width:0}#top input{width:110px}
</style>
</head>
<body>
<div id="top">
  <button id="home2" title="Elenco partite">☰</button>
  <span class="sc"><small>AZZURRA</small><span id="sA">0</span>–<span id="sB">0</span></span>
  <input id="opp" placeholder="Avversario">
  <div class="og"><button data-og="p">+Gol avv</button><button class="u" data-og="u">+Gol avv UP</button></div>
  <span id="last"></span>
  <button id="rob">✎ Modifica</button>
  <button class="per" data-p="1">1T</button><button class="per" data-p="2">2T</button><button class="per" data-p="3">3T</button><button class="per" data-p="4">4T</button>
  <button id="undo">↶ Annulla</button>
  <button id="sum">Riepilogo</button>
  <button id="snd">🔊</button>
  <button id="fs">⛶</button>
</div>
<div id="g"></div>
<div id="ov"><div class="box">
  <textarea id="txt" readonly></textarea>
  <div class="row">
    <button class="btn" id="copy">Copia testo</button>
    <button class="btn" id="csv">Scarica CSV</button>
    <button class="btn" id="bak" style="background:#2e7d32">Salva copia</button>
    <button class="btn" id="send" style="background:#6a1b9a">☁ Invia statistiche</button>
    <button class="btn" id="end" style="background:#c62828">Termina partita</button>
    <span style="flex:1"></span>
    <button class="btn" id="close" style="background:#555">Chiudi</button>
  </div>
</div></div>
<div id="home">
  <header><img src="icon-192.png" alt=""><h1>Azzurra WP Stat<br><small id="stsave"></small></h1></header>
  <div id="list"></div>
  <footer>
    <button class="btn" id="hnew">+ Nuova partita</button>
    <button class="btn" id="himp" style="background:#2e7d32">Carica distinta o copia (file)</button>
    <button class="btn" id="hsheet" style="background:#6a1b9a;display:none">📊 Apri statistiche</button>
  </footer>
</div>
<div id="msg"></div>
<input type="file" id="imp" accept=".json,application/json" style="display:none">
<script>
(function(){
var N=15,KEY='wp_app_v2',F=['g','gu','a','au','e'];
var LBL={g:'Gol',gu:'Gol UP',a:'Assist',au:'Assist UP',e:'Espuls.',x:'Espuls. avv',og:'Gol avv',ogu:'Gol avv UP'};
function z(){var a=[];for(var i=0;i<N;i++)a.push(0);return a}
function blank(m){var o={id:'m'+Date.now(),gio:'',date:new Date().toISOString().slice(0,10),time:'',home:true,opp:'',place:'',names:[],
  g:z(),gu:z(),a:z(),au:z(),e:z(),x:z(),og:0,ogu:0,log:[],per:1,done:false,upd:0};for(var k in (m||{}))o[k]=m[k];
  while(o.names.length<N)o.names.push('');F.concat(['x']).forEach(function(f){if(!o[f]||o[f].length!=N)o[f]=z()});if(!o.log)o.log=[];return o}
function toast(t){var m=document.getElementById('msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){m.style.display='none'},2600)}
function sum(a){var t=0;for(var i=0;i<a.length;i++)t+=a[i];return t}
function esc(t){return String(t||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

// ---------- archivio partite ----------
var DB=null,canSave=true;
try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){canSave=false}
if(!DB||!DB.matches)DB={matches:[],mute:false};
// recupero dati della versione precedente (una sola partita)
try{var old=JSON.parse(localStorage.getItem('wp_app_v1'));if(old&&old.log&&old.log.length&&!DB.migr){
  DB.matches.push(blank({id:'old'+(old.upd||1),opp:old.opp,names:old.names,g:old.g,gu:old.gu,a:old.a,au:old.au,e:old.e,x:old.x,og:old.og,ogu:old.ogu,log:old.log,per:old.per,date:(old.start||'').slice(0,10)||undefined}))}DB.migr=1}catch(e){}
function persist(){try{var j=JSON.stringify(DB);localStorage.setItem(KEY,j);if(localStorage.getItem(KEY)!==j)throw 0}catch(e){if(canSave){canSave=false;toast('⚠ Salvataggio non riuscito: usa "Salva copia"')}}}
function storageOk(){try{localStorage.setItem(KEY+'_t','1');return localStorage.getItem(KEY+'_t')=='1'}catch(e){return false}}
function byId(id){for(var i=0;i<DB.matches.length;i++)if(DB.matches[i].id==id)return DB.matches[i];return null}
// importa distinte: aggiunge nuove partite; aggiorna quelle non iniziate; non tocca mai statistiche già registrate
function merge(list){var n=0,u=0;list.forEach(function(m){if(!m)return;var ex=m.id?byId(m.id):null;
  if(!ex){DB.matches.push(blank(m));n++;return}
  ['gio','date','time','home','opp','place'].forEach(function(k){if(m[k]!==undefined)ex[k]=m[k]});
  if(!ex.log.length&&m.names)ex.names=blank({names:m.names}).names;
  if(m.log&&m.log.length&&!ex.log.length){F.concat(['x','og','ogu','log','per','done']).forEach(function(k){if(m[k]!==undefined)ex[k]=m[k]})}
  u++});persist();return [n,u]}
try{var hm=location.hash.match(/d=([^&]+)/);if(hm){var r=merge(JSON.parse(decodeURIComponent(hm[1])).matches||[]);
  history.replaceState(null,'',location.pathname);setTimeout(function(){toast('Distinte caricate: '+r[0]+' nuove, '+r[1]+' aggiornate')},300)}}catch(e){}
persist();

// ---------- distinte automatiche (file cifrato sul sito, codice squadra) ----------
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function decrypt(o,pin){var c=crypto.subtle;return c.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey'])
  .then(function(k){return c.deriveKey({name:'PBKDF2',salt:b64(o.salt),iterations:o.it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
  .then(function(key){return c.decrypt({name:'AES-GCM',iv:b64(o.iv)},key,b64(o.data))})
  .then(function(buf){return JSON.parse(new TextDecoder().decode(buf))})}
function syncDistinte(ask){if(!window.crypto||!crypto.subtle)return;
  fetch('distinte.enc?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(o){
    if(!DB.pin){if(!ask)return;var p=prompt('Codice squadra (si inserisce una sola volta):');if(!p)return;DB.pin=p.trim()}
    if(DB.encv===o.data&&!ask)return;
    return decrypt(o,DB.pin).then(function(d){var r=merge(d.matches||[]);if(d.cfg)DB.cfg=d.cfg;DB.encv=o.data;persist();renderHome();sendAll();
      if(r[0]||ask)toast('Distinte aggiornate: '+r[0]+' nuove, '+r[1]+' controllate')},
      function(){DB.pin='';persist();toast('Codice squadra errato');if(ask)setTimeout(function(){syncDistinte(true)},800)})
  }).catch(function(){})}

// ---------- invio statistiche al Foglio Google (solo quando c'è connessione) ----------
function pending(m){return m.log.length&&(m.upd||0)>(m.sent||0)}
function rowsOf(m){var s=score(m),O=m.opp||'',P=[],Gi=[],E=[],ps=[];
  for(var p=1;p<=4;p++){var a=0,b=0;m.log.forEach(function(e){if(e[2]!=p)return;if(e[0]=='g'||e[0]=='gu')a++;if(e[0]=='og'||e[0]=='ogu')b++});ps.push(m.home?a+'-'+b:b+'-'+a)}
  P.push([m.id,m.gio||'',m.date||'',m.time||'',m.home?'Casa':'Trasferta',O,m.place||'',s[0],s[1],m.home?'Azzurra '+s[0]+'-'+s[1]+' '+O:O+' '+s[1]+'-'+s[0]+' Azzurra',ps.join(' / '),sum(m.gu),m.ogu,sum(m.e),sum(m.x),m.done?'Conclusa':'In corso',new Date().toLocaleString('it-IT')]);
  for(var i=0;i<N;i++)if(m.names[i]||m.g[i]||m.gu[i]||m.a[i]||m.au[i]||m.e[i])Gi.push([m.id,m.date||'',O,i+1,m.names[i]||('Calotta '+(i+1)),m.g[i]+m.gu[i],m.gu[i],m.a[i]+m.au[i],m.au[i],m.e[i]]);
  m.log.forEach(function(e){var c=e[1]>=0?e[1]+1:'';E.push([m.id,m.date||'',O,e[2]+'T',new Date(e[3]).toLocaleTimeString('it-IT'),LBL[e[0]],c,(e[0]=='x'||e[0]=='og'||e[0]=='ogu')?'':(m.names[e[1]]||'')])});
  return {Partite:P,Giocatori:Gi,Eventi:E}}
var sending=false;
function sendAll(manual){if(!DB.cfg||!DB.cfg.url){if(manual)toast('Invio non ancora configurato');return}
  if(!navigator.onLine){if(manual)toast('Sei offline: invierò appena torna la connessione');return}
  if(sending)return;var q=DB.matches.filter(pending);if(!q.length){if(manual)toast('Statistiche già inviate ✓');return}
  sending=true;var m=q[0],stamp=m.upd;
  fetch(DB.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:DB.cfg.token,id:m.id,rows:rowsOf(m)})})
   .then(function(r){return r.json()}).then(function(j){sending=false;if(!j.ok)throw 0;m.sent=stamp;persist();if(home.style.display!='none')renderHome();
     toast('Statistiche inviate ✓ '+title(m));sendAll(false)})
   .catch(function(){sending=false;if(manual)toast('Invio non riuscito, riprovo più tardi')})}
window.addEventListener('online',function(){setTimeout(function(){sendAll(false)},1500)});
setInterval(function(){sendAll(false)},120000);

var S=null; // partita aperta
function save(){if(!S)return;S.upd=Date.now();persist()}

// ---------- griglia ----------
var g=document.getElementById('g'),H='';
function d(cls,html,attr){return '<div class="'+cls+'"'+(attr||'')+'>'+(html||'')+'</div>'}
var GC={g:'cg gl',gu:'cg up',a:'ca gl',au:'ca up',e:'ce gl'};
H+=d('h hn','Cal.')+d('h hn','Giocatore')+d('h hg gl','GOL')+d('h hu','GOL<br>uomo +')+d('h ha gl','ASSIST')+d('h hu','ASSIST<br>uomo +')+d('h he gl','ESPULS.')+d('sep')+d('h hx','Cal.')+d('h hx','ESPULS.<br>avversari');
for(var i=0;i<N;i++){var zb=i%2?' z':'';
  H+=d('n'+zb,i+1,' id="n'+i+'"')+d('nm'+zb,'<input data-i="'+i+'" maxlength="16">',' id="m'+i+'"');
  F.forEach(function(f){H+=d('c '+GC[f]+zb,'',' data-f="'+f+'" data-i="'+i+'" id="'+f+i+'"')});
  H+=d('sep')+d('n'+zb,i+1,' style="color:#6a1b9a"')+d('c cx'+zb,'',' data-f="x" data-i="'+i+'" id="x'+i+'"');
}
H+=d('tot','Tot')+d('tot','');F.forEach(function(f){H+=d('tot '+GC[f].replace('up',''),'',' id="t'+f+'"')});H+=d('sep')+d('tot','')+d('tot cx','',' id="tx"');
g.innerHTML=H;
var inputs=g.querySelectorAll('.nm input');
for(var k=0;k<inputs.length;k++)inputs[k].addEventListener('change',function(){S.names[this.dataset.i]=this.value.trim();save()});
var oppIn=document.getElementById('opp');oppIn.addEventListener('change',function(){S.opp=this.value.trim();save()});

function marks(v,f){if(!v)return '';if((f=='e'||f=='x')&&v<=3)return new Array(v+1).join('X ');return v}
function cell(f,i){var el=document.getElementById(f+i),v=S[f][i];el.textContent=marks(v,f);
  if(f=='e'||f=='x'){el.classList.toggle('out',v>=3);if(f=='e'){var o=v>=3;document.getElementById('n'+i).classList.toggle('dim',o);document.getElementById('m'+i).classList.toggle('dim',o);['g','gu','a','au'].forEach(function(k){document.getElementById(k+i).classList.toggle('dim',o)})}}}
function totals(){F.forEach(function(f){document.getElementById('t'+f).textContent=sum(S[f])});document.getElementById('tx').textContent=sum(S.x);
  document.getElementById('sA').textContent=sum(S.g)+sum(S.gu);document.getElementById('sB').textContent=S.og+S.ogu;
  var b=document.querySelectorAll('.per');for(var j=0;j<b.length;j++)b[j].classList.toggle('on',+b[j].dataset.p==S.per)}
function all(){for(var i=0;i<N;i++){F.forEach(function(f){cell(f,i)});cell('x',i);inputs[i].value=S.names[i]||''}oppIn.value=S.opp||'';totals()}

var lastRow=null;
var AC=null,TONE={g:[880,1320],gu:[880,1320],og:[440,330],ogu:[440,330],a:[660,990],au:[660,990],e:[300,0],x:[300,0]};
function beep(f,sign){if(DB.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
  var fr=sign>0?TONE[f]:[220,0],t=AC.currentTime;fr.forEach(function(hz,k){if(!hz)return;var o=AC.createOscillator(),gn=AC.createGain();o.type='sine';o.frequency.value=hz;
  gn.gain.setValueAtTime(0.0001,t+k*.09);gn.gain.exponentialRampToValueAtTime(0.5,t+k*.09+.01);gn.gain.exponentialRampToValueAtTime(0.0001,t+k*.09+.12);o.connect(gn);gn.connect(AC.destination);o.start(t+k*.09);o.stop(t+k*.09+.13)})}catch(e){}}
function fb(f,i,sign){beep(f,sign);
  var who=(f=='og'||f=='ogu')?(S.opp||'Avversario'):(f=='x'?'Avv. cal. '+(i+1):(i+1)+' '+(S.names[i]||''));
  document.getElementById('last').textContent=(sign>0?'✓ ':'− ')+LBL[f]+' · '+who+' · '+S.per+'T';
  if(f=='og'||f=='ogu')return;var el=document.getElementById(f+i);el.classList.add('flash');setTimeout(function(){el.classList.remove('flash')},250);
  if(f!='x'){var rw=[document.getElementById('n'+i),document.getElementById('m'+i)];F.forEach(function(k){if(k!=f)rw.push(document.getElementById(k+i))});
   rw.forEach(function(x){x.classList.add('rowfl')});setTimeout(function(){rw.forEach(function(x){x.classList.remove('rowfl')})},250)}
  if(f!='x'){if(lastRow)lastRow.classList.remove('last');lastRow=document.getElementById('n'+i);lastRow.classList.add('last')}}
function add(f,i){if(S.done)return;
  if(f=='og'||f=='ogu')S[f]++;else{S[f][i]++;cell(f,i)}
  S.log.push([f,i,S.per,Date.now()]);if(S.e[i]==3&&f=='e')toast('Calotta '+(i+1)+' – 3 espulsioni');
  totals();save();fb(f,i,1)}
function remove(f,i){if(S.done)return;
  for(var k=S.log.length-1;k>=0;k--){var e=S.log[k];if(e[0]==f&&e[1]==i){S.log.splice(k,1);break}}
  if(f=='og'||f=='ogu')S[f]=Math.max(0,S[f]-1);else{S[f][i]=Math.max(0,S[f][i]-1);cell(f,i)}
  totals();save();fb(f,i,-1)}
var lastPen=0;
['pointermove','pointerdown'].forEach(function(t){document.addEventListener(t,function(e){if(e.pointerType=='pen')lastPen=Date.now()},true)});
function palm(e){return e.pointerType=='touch'&&Date.now()-lastPen<1500}
var lp=null,lpDone=false;
g.addEventListener('pointerdown',function(ev){var c=ev.target.closest('.c');if(!c||palm(ev)||S.done)return;lpDone=false;
  lp=setTimeout(function(){lpDone=true;var f=c.dataset.f,i=+c.dataset.i;if(S[f][i]>0){remove(f,i);toast('−1 '+LBL[f]+' cal. '+(i+1))}},600)});
function cancel(){clearTimeout(lp)}
g.addEventListener('pointerleave',cancel);g.addEventListener('pointercancel',cancel);
g.addEventListener('pointerup',function(ev){cancel();var c=ev.target.closest('.c');if(!c||lpDone||palm(ev))return;add(c.dataset.f,+c.dataset.i)});
g.addEventListener('contextmenu',function(e){e.preventDefault()});
document.querySelector('.og').addEventListener('click',function(e){var b=e.target.closest('button');if(b)add(b.dataset.og=='p'?'og':'ogu',-1)});
var pers=document.querySelectorAll('.per');for(var j=0;j<pers.length;j++)pers[j].addEventListener('click',function(){var np=+this.dataset.p;if(np>S.per&&S.log.length)backup('fine'+S.per+'T');S.per=np;totals();save()});
document.getElementById('undo').addEventListener('click',function(){var e=S.log[S.log.length-1];if(!e){toast('Niente da annullare');return}
  remove(e[0],e[1]);toast('Annullato: '+LBL[e[0]]+(e[1]>=0?' cal. '+(e[1]+1):''))});

// ---------- schermo intero ----------
var APP=false;try{APP=matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches}catch(e){}
function goFS(){if(APP){try{screen.orientation.lock('landscape').catch(function(){})}catch(e){}return}
  try{var q=document.documentElement.requestFullscreen({navigationUI:'hide'});if(q&&q.then)q.then(function(){try{screen.orientation.lock('landscape').catch(function(){})}catch(x){}}).catch(function(){})}catch(e){}}
var fsb=document.getElementById('fs');if(APP)fsb.style.display='none';
fsb.addEventListener('click',function(){if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}}else goFS()});
document.addEventListener('fullscreenchange',function(){fsb.classList.toggle('warn',!document.fullscreenElement)});fsb.classList.add('warn');
var sb=document.getElementById('snd');function sbu(){sb.textContent=DB.mute?'🔇':'🔊'}sbu();
sb.addEventListener('click',function(){DB.mute=!DB.mute;sbu();persist();if(!DB.mute)beep('g',1)});
function wake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}}
wake();document.addEventListener('visibilitychange',function(){if(document.visibilityState=='visible')wake()});

// ---------- file ----------
function dl(name,data,type){var b=new Blob([data],{type:type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}
function fname(m){m=m||S;return 'partita_'+(m.date||'')+'_'+(m.opp||'avv').replace(/\W+/g,'_')}
function backup(tag,m){m=m||S;try{dl(fname(m)+'_copia_'+tag+'.json',JSON.stringify({matches:[m]}),'application/json');toast('Copia salvata in Download ('+tag+')')}catch(e){}}
document.getElementById('bak').addEventListener('click',function(){backup(new Date().toTimeString().slice(0,5).replace(':','.'))});
var imp=document.getElementById('imp');
document.getElementById('himp').addEventListener('click',function(){imp.click()});
imp.addEventListener('change',function(){var f=imp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result),list;
  if(o.matches)list=o.matches;else if(o.g&&o.log)list=[{id:'f'+Date.now(),opp:o.opp,names:o.names,g:o.g,gu:o.gu,a:o.a,au:o.au,e:o.e,x:o.x,og:o.og,ogu:o.ogu,log:o.log,per:o.per,date:(o.start||'').slice(0,10)}];else throw 0;
  var res=merge(list);renderHome();toast('Caricate: '+res[0]+' nuove, '+res[1]+' aggiornate')}catch(e){toast('File non valido')}imp.value=''};r.readAsText(f)});

// ---------- elenco partite ----------
var home=document.getElementById('home'),listEl=document.getElementById('list');
function fdate(m){try{return new Date(m.date+'T12:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}catch(e){return m.date}}
function score(m){return [sum(m.g)+sum(m.gu),m.og+m.ogu]}
function title(m){return m.home?'AZZURRA – '+(m.opp||'?'):(m.opp||'?')+' – AZZURRA'}
function res(m){var s=score(m);return m.home?s[0]+' – '+s[1]:s[1]+' – '+s[0]}
function renderHome(){document.getElementById('hsheet').style.display=DB.cfg&&DB.cfg.view?'':'none';var ms=DB.matches.slice().sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)});
  if(!ms.length){listEl.innerHTML='<div id="empty">Nessuna partita.<br>Apri il link della distinta oppure tocca "+ Nuova partita".</div>';return}
  listEl.innerHTML=ms.map(function(m){var cls=m.done?'done':(m.log.length?'run':''),st=m.done?'Conclusa<b>'+res(m)+'</b>':(m.log.length?'In corso · '+m.per+'T<b>'+res(m)+'</b>':'Da giocare');
    return '<div class="card '+cls+'" data-id="'+esc(m.id)+'"><div class="when"><b>'+esc(m.gio||'Partita')+'</b>'+esc(fdate(m))+(m.time?' · '+esc(m.time):'')+'</div>'+
      '<div class="match">'+esc(title(m))+'<small>'+esc(m.place||'')+(m.log.length&&DB.cfg&&DB.cfg.url?(pending(m)?' · ☁ da inviare':' · ☁ inviata ✓'):'')+'</small></div><div class="st">'+st+'</div><button class="del" data-del="'+esc(m.id)+'">🗑</button></div>'}).join('')}
listEl.addEventListener('click',function(e){var del=e.target.closest('[data-del]');
  if(del){var m=byId(del.dataset.del);if(!confirm('Eliminare la partita "'+title(m)+'"?'+(m.log.length?' Prima ne scarico una copia.':'')))return;
    if(m.log.length)backup('eliminata',m);DB.matches=DB.matches.filter(function(x){return x!==m});persist();renderHome();return}
  var c=e.target.closest('.card');if(c)openMatch(c.dataset.id)});
function openMatch(id){S=byId(id);if(!S)return;lastRow=null;[].forEach.call(document.querySelectorAll('#g .last'),function(x){x.classList.remove('last')});document.getElementById('last').textContent=S.done?'Partita conclusa · sola lettura':(S.gio?S.gio+' · ':'')+fdate(S);
  document.body.classList.toggle('ro',!!S.done);all();home.style.display='none';goFS();
  if(!S.done&&!S.log.length)toast((S.gio?S.gio+': ':'')+title(S)+' – pronta a registrare')}
function showHome(){S=null;document.getElementById('ov').style.display='none';renderHome();home.style.display='flex';sendAll(false)}
document.getElementById('home2').addEventListener('click',showHome);
document.getElementById('hsheet').addEventListener('click',function(){if(DB.cfg&&DB.cfg.view)window.open(DB.cfg.view,'_blank')});
document.getElementById('rob').addEventListener('click',function(){if(!confirm('Riaprire la partita conclusa per modificarla?'))return;S.done=false;save();document.body.classList.remove('ro');document.getElementById('last').textContent='Partita riaperta'});
document.getElementById('hnew').addEventListener('click',function(){var opp=prompt('Avversario:');if(opp===null)return;
  var dt=prompt('Data (aaaa-mm-gg):',new Date().toISOString().slice(0,10));if(dt===null)return;
  var casa=confirm('Azzurra gioca in casa?\nOK = in casa · Annulla = in trasferta');
  var last=DB.matches.slice().sort(function(a,b){return (b.date+b.time).localeCompare(a.date+a.time)})[0];
  var m=blank({opp:opp.trim(),date:dt.trim(),home:casa,names:last?last.names.slice():[]});DB.matches.push(m);persist();openMatch(m.id)});
document.getElementById('stsave').textContent=storageOk()?'Salvataggio automatico attivo ✓':'⚠ Salvataggio non disponibile: usa "Salva copia"';

// ---------- riepilogo ----------
function nm(i){return (i+1)+(S.names[i]?' '+S.names[i]:'')}
function perScore(){var r=[];for(var p=1;p<=4;p++){var a=0,b=0;S.log.forEach(function(e){if(e[2]!=p)return;if(e[0]=='g'||e[0]=='gu')a++;if(e[0]=='og'||e[0]=='ogu')b++});r.push(S.home?a+'-'+b:b+'-'+a)}return r.join(', ')}
function summary(){var s=score(S),t=[],O=S.opp||'Avversario';
  if(S.gio||S.date)t.push((S.gio?S.gio+' · ':'')+fdate(S)+(S.place?' · '+S.place:''));
  t.push(S.home?'Azzurra '+s[0]+' - '+s[1]+' '+O:O+' '+s[1]+' - '+s[0]+' Azzurra');
  t.push('Parziali: '+perScore());
  t.push('Gol in superiorità: Azzurra '+sum(S.gu)+', '+O+' '+S.ogu);
  t.push('Espulsioni: Azzurra '+sum(S.e)+', '+O+' '+sum(S.x));
  t.push('');t.push('Marcatori');
  for(var i=0;i<N;i++){var gg=S.g[i]+S.gu[i];if(gg)t.push(nm(i)+': '+gg+(S.gu[i]?' ('+S.gu[i]+' in sup.)':''))}
  t.push('');t.push('Assist');
  for(i=0;i<N;i++){var aa=S.a[i]+S.au[i];if(aa)t.push(nm(i)+': '+aa+(S.au[i]?' ('+S.au[i]+' in sup.)':''))}
  var ex=[];for(i=0;i<N;i++)if(S.e[i])ex.push(nm(i)+': '+S.e[i]+(S.e[i]>=3?' (fuori)':''));
  if(ex.length){t.push('');t.push('Espulsioni Azzurra');t=t.concat(ex)}
  return t.join('\n')}
function csv(){var r=['Calotta;Nome;Gol;Gol UP;Assist;Assist UP;Espulsioni;Espulsioni avv'];
  for(var i=0;i<N;i++)r.push([i+1,'"'+(S.names[i]||'').replace(/"/g,"'")+'"',S.g[i],S.gu[i],S.a[i],S.au[i],S.e[i],S.x[i]].join(';'));
  r.push('');r.push('Avversario;'+(S.opp||'')+';Gol avv;'+S.og+';Gol avv UP;'+S.ogu);
  r.push('');r.push('Evento;Calotta;Tempo;Ora');
  S.log.forEach(function(e){r.push([LBL[e[0]],e[1]>=0?e[1]+1:'',e[2],new Date(e[3]).toLocaleTimeString('it-IT')].join(';'))});
  return '\ufeff'+r.join('\r\n')}
var ov=document.getElementById('ov'),txt=document.getElementById('txt');
document.getElementById('sum').addEventListener('click',function(){txt.value=summary();document.getElementById('end').style.display=S.done?'none':'';ov.style.display='flex'});
document.getElementById('close').addEventListener('click',function(){ov.style.display='none'});
document.getElementById('copy').addEventListener('click',function(){
  function fb2(){txt.removeAttribute('readonly');txt.select();try{document.execCommand('copy');toast('Copiato')}catch(e){toast('Seleziona e copia a mano')}txt.setAttribute('readonly','')}
  try{navigator.clipboard.writeText(txt.value).then(function(){toast('Copiato')},fb2)}catch(e){fb2()}});
document.getElementById('csv').addEventListener('click',function(){dl(fname()+'.csv',csv(),'text/csv')});
document.getElementById('send').addEventListener('click',function(){sendAll(true)});
document.getElementById('end').addEventListener('click',function(){if(!confirm('Terminare la partita? Resterà consultabile in sola lettura.'))return;
  S.done=true;save();backup('finale');showHome()});

// Indietro: torna all'elenco, non chiude l'app
try{history.pushState({g:1},'',location.href);window.addEventListener('popstate',function(){history.pushState({g:1},'',location.href);if(home.style.display=='none')showHome();else toast('Per uscire chiudi l\'app')})}catch(e){}
showHome();
syncDistinte(!DB.pin);
window.addEventListener('online',function(){syncDistinte(false)});
})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
